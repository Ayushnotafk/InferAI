Anumana:
  - id: ANUMANA_001
    pramana: Anumana
    cue_type: because
    weight: 2.0
    pattern: "\\bbecause\\b"
    description: Causal/inferential connective cue.
    example_trigger: "It must be raining because the street is wet."
    example_non_trigger: "It must be raining; the street is wet."
  - id: ANUMANA_002
    pramana: Anumana
    cue_type: therefore
    weight: 2.3
    pattern: "\\btherefore\\b"
    description: Conclusion marker indicating inference.
    example_trigger: "The premises are true; therefore the claim follows."
    example_non_trigger: "The premises are true; the claim follows."
  - id: ANUMANA_003
    pramana: Anumana
    cue_type: thus
    weight: 2.0
    pattern: "\\bthus\\b"
    description: Conclusion marker indicating inference.
    example_trigger: "The engine has no fuel, thus it cannot start."
    example_non_trigger: "The engine has no fuel; it cannot start."
  - id: ANUMANA_004
    pramana: Anumana
    cue_type: hence
    weight: 2.1
    pattern: "\\bhence\\b"
    description: Conclusion marker indicating inference.
    example_trigger: "The lights are off, hence nobody is home."
    example_non_trigger: "The lights are off; nobody is home."
  - id: ANUMANA_005
    pramana: Anumana
    cue_type: consequently
    weight: 2.2
    pattern: "\\bconsequently\\b"
    description: Consequence marker used in inferential chains.
    example_trigger: "The supply is cut; consequently production stops."
    example_non_trigger: "The supply is cut; production stops."
  - id: ANUMANA_006
    pramana: Anumana
    cue_type: implies
    weight: 2.1
    pattern: "\\bimplies\\b"
    description: Logical implication cue.
    example_trigger: "A rising fever implies an infection."
    example_non_trigger: "A rising fever describes an infection."
  - id: ANUMANA_007
    pramana: Anumana
    cue_type: suggests
    weight: 1.6
    pattern: "\\bsuggests\\b"
    description: Suggestive inference cue (weaker than explicit therefore).
    example_trigger: "The pattern suggests a systemic issue."
    example_non_trigger: "The pattern shows a systemic issue."
  - id: ANUMANA_008
    pramana: Anumana
    cue_type: likely
    weight: 1.5
    pattern: "\\blikely\\b"
    description: Probabilistic inference cue.
    example_trigger: "It is likely the server is overloaded."
    example_non_trigger: "It is the server that is overloaded."
  - id: ANUMANA_009
    pramana: Anumana
    cue_type: causes
    weight: 2.0
    pattern: "\\bcauses\\b"
    description: Explicit causal claim cue.
    example_trigger: "Smoking causes respiratory problems."
    example_non_trigger: "Smoking correlates with respiratory problems."
  - id: ANUMANA_010
    pramana: Anumana
    cue_type: if...then
    weight: 2.4
    pattern: "\\bif\\b.{0,40}\\bthen\\b"
    description: Conditional reasoning cue within a bounded span.
    example_trigger: "If the alarm is armed then the door cannot open."
    example_non_trigger: "If the alarm is armed, the door cannot open."
  - id: ANUMANA_011
    pramana: Anumana
    cue_type: due to
    weight: 2.0
    pattern: "\\bdue to\\b"
    description: Causal attribution cue.
    example_trigger: "The delay occurred due to network congestion."
    example_non_trigger: "The delay occurred during network congestion."
  - id: ANUMANA_012
    pramana: Anumana
    cue_type: results in
    weight: 2.1
    pattern: "\\bresults in\\b"
    description: Consequence phrasing cue.
    example_trigger: "Lack of sleep results in poor attention."
    example_non_trigger: "Lack of sleep is linked to poor attention."
  - id: ANUMANA_013
    pramana: Anumana
    cue_type: leads to
    weight: 2.1
    pattern: "\\bleads to\\b"
    description: Consequence phrasing cue.
    example_trigger: "Overheating leads to system shutdowns."
    example_non_trigger: "Overheating is associated with shutdowns."
  - id: ANUMANA_014
    pramana: Anumana
    cue_type: therefore it follows
    weight: 2.5
    pattern: "\\btherefore it follows\\b"
    description: Strong explicit inferential phrase.
    example_trigger: "All metals expand when heated; therefore it follows this rod will expand."
    example_non_trigger: "All metals expand when heated; this rod will expand."
  - id: ANUMANA_015
    pramana: Anumana
    cue_type: since
    weight: 1.7
    pattern: "\\bsince\\b"
    description: Premise-introducing cue used for inference.
    example_trigger: "Since the battery is dead, the car will not start."
    example_non_trigger: "Since yesterday, the battery is dead."
  - id: ANUMANA_016
    pramana: Anumana
    cue_type: which suggests
    weight: 1.9
    pattern: "\\bwhich suggests\\b"
    description: Phrase indicating an interpretive inference from evidence.
    example_trigger: "The results were inconsistent, which suggests measurement error."
    example_non_trigger: "The results were inconsistent, which shows measurement error."
  - id: ANUMANA_017
    pramana: Anumana
    cue_type: most likely
    weight: 1.8
    pattern: "\\bmost likely\\b"
    description: Stronger probabilistic inference cue.
    example_trigger: "The cause is most likely a short circuit."
    example_non_trigger: "The cause is a short circuit."

Upamana:
