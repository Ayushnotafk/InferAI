Pratyaksha:
  - id: PRATYAKSHA_001
    pramana: Pratyaksha
    cue_type: observed
    weight: 1.6
    pattern: "\\bobserved\\b"
    description: Direct perception cue via explicit observation wording.
    example_trigger: "We observed a clear increase in brightness."
    example_non_trigger: "We inferred a clear increase in brightness."
  - id: PRATYAKSHA_002
    pramana: Pratyaksha
    cue_type: measured
    weight: 1.8
