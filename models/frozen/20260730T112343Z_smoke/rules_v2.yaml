    example_non_trigger: "This is a model for societal collapse."
  - id: UPAMANA_010
    pramana: Upamana
    cue_type: in the same way
    weight: 2.4
    pattern: "\\bin the same way\\b"
    description: Analogy cue via "in the same way" phrasing.
    example_trigger: "In the same way a seed grows, ideas can grow."
    example_non_trigger: "In the same day a seed grows, ideas can grow."
  - id: UPAMANA_011
    pramana: Upamana
    cue_type: as if
    weight: 2.2
    pattern: "\\bas if\\b"
    description: Simile-like framing cue via "as if".
    example_trigger: "He spoke as if he were an expert."
    example_non_trigger: "He spoke as he was an expert."
  - id: UPAMANA_012
    pramana: Upamana
    cue_type: is like
    weight: 2.4
    pattern: "\\bis like\\b"
    description: Direct simile phrase ("is like").
    example_trigger: "Their strategy is like building on sand."
    example_non_trigger: "Their strategy is building on sand."
  - id: UPAMANA_013
    pramana: Upamana
    cue_type: like a/an
    weight: 2.0
    pattern: "\\blike a\\b|\\blike an\\b"
    description: Phrase-level simile cue ("like a/an"), with false-positive suppression in code for "I like X".
    example_trigger: "The mind is like a mirror."
    example_non_trigger: "I like football."

Shabda:
  - id: SHABDA_001
    pramana: Shabda
    cue_type: according to official body
    weight: 3.4
    pattern: "\\baccording to\\s+(?:who|world health organization|cdc|unesco|fda|nasa|the government|government|official report|court judgement|court judgment)\\b"
    description: Tiered "according to" for official institutions or legal/official documents.
    example_trigger: "According to WHO, vaccines are effective."
    example_non_trigger: "According to my friend, vaccines are effective."
  - id: SHABDA_002
    pramana: Shabda
    cue_type: according to expert/study
    weight: 2.7
    pattern: "\\baccording to\\s+(?:experts?|researchers?|scientists?|the study|a study|research|medical guidelines?|journal|published)\\b"
    description: Tiered "according to" for experts, studies, or research context.
    example_trigger: "According to researchers, the method reduces error."
    example_non_trigger: "According to my mom, the method reduces error."
  - id: SHABDA_003
    pramana: Shabda
    cue_type: according to informal source
    weight: 0.7
    pattern: "\\baccording to\\s+(?:my friend|my mom|my dad|a friend|some guy)\\b"
    description: Informal testimony marker; treated as weak Shabda.
    example_trigger: "According to my friend, this works every time."
    example_non_trigger: "We measured that this works every time."
